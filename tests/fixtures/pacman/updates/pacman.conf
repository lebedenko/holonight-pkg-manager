# Fixture pacman.conf for the updates tests. Only [options] IgnorePkg / IgnoreGroup are read.
[options]
HoldPkg     = pacman glibc
Architecture = auto
IgnorePkg   = ign*        # glob, matches "ignoreme"
IgnorePkg   = never-installed
#IgnorePkg  = alpha
IgnoreGroup = fruits

[core]
IgnorePkg = alpha
Include = mirrorlist

[extra]
IgnoreGroup = extra-only-group
Include = mirrorlist
