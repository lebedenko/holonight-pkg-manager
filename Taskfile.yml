version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
  BUILD_DIR: build/{{.PRESET}}
tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  run:
    desc: Build and run HoloNight Packages
    deps:
    - build
    cmds:
    - '"./{{.BUILD_DIR}}/holonight-packages"'
  run:packaged:
    desc: Build and run the session update service without installing it
    deps:
    - build
    cmds:
    - '"./build/{{.PRESET}}/holonight-packaged" {{.CLI_ARGS}}'
  coverage:
    desc: Build coverage report
    cmds:
    - cmake --preset dev -B build/coverage -DENABLE_COVERAGE=ON
    - cmake --build build/coverage --target coverage
  qml-lint:
    desc: qml-lint
    cmds:
    - cmake --build build/{{.PRESET}} --target qml-lint
  clean:
    desc: Remove the build directory
    cmds:
    - rm -rf {{.BUILD_DIR}}
    prompt: Remove {{.BUILD_DIR}}/ entirely?
  qml-import-check:
    desc: qml-import-check
    cmds:
    - python3 scripts/check-runtime-imports.py
  layering-check:
    desc: Check layering and safety policy (libalpm, processes, transactions, GUI/service split, test sync carve-out)
    cmds:
    - python3 scripts/check-layering.py
    - python3 tests/policy/test_layering_policy.py
  qmltypes-check:
    desc: Build and verify generated QML metadata
    cmds:
    - bash scripts/check-qmltypes.sh build/{{.PRESET}}
    deps:
    - build
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - dbus-run-session -- ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
