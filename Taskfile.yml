version: "3"

vars:
  BUILD_DIR: build
  HOLONIGHT_QT_PREFIX: '{{.TASKFILE_DIR}}/{{.BUILD_DIR}}/dependencies/prefix'
  HOLONIGHT_QT_DIR: '{{.HOLONIGHT_QT_PREFIX}}/lib/cmake/HolonightQt'
  HOLONIGHT_QT_SOURCE: '{{default "../holonight-qt" .HOLONIGHT_QT_SOURCE}}'
  HOLONIGHT_QT_REVISION: 478ef7c40a22c7c3f7ea6f45d9205411b5504834
  HOLONIGHT_CONFIG_SOURCE: '{{default "../holonight-config" .HOLONIGHT_CONFIG_SOURCE}}'
  HOLONIGHT_CONFIG_REVISION: fe69a59e6b73167fd5349223a4d265d75386c139
  NPROC:
    sh: nproc

tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds: [reuse lint]

  build:config-dependency:
    desc: Build and stage the pinned configuration dependency
    cmds:
      - test "$(git -C {{.HOLONIGHT_CONFIG_SOURCE}} rev-parse HEAD)" = "{{.HOLONIGHT_CONFIG_REVISION}}"
      - cmake -S {{.HOLONIGHT_CONFIG_SOURCE}} -B {{.BUILD_DIR}}/dependencies/config -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - cmake --build {{.BUILD_DIR}}/dependencies/config -j{{.NPROC}}
      - cmake --install {{.BUILD_DIR}}/dependencies/config --prefix {{.HOLONIGHT_QT_PREFIX}}

  build:qt-dependency:
    desc: Build and stage the pinned provider without tests or examples
    deps: [build:config-dependency]
    cmds:
      - test "$(git -C {{.HOLONIGHT_QT_SOURCE}} rev-parse HEAD)" = "{{.HOLONIGHT_QT_REVISION}}"
      - cmake -S {{.HOLONIGHT_QT_SOURCE}} -B {{.BUILD_DIR}}/dependencies/qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH={{.HOLONIGHT_QT_PREFIX}} -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_WAYLAND=ON
      - cmake --build {{.BUILD_DIR}}/dependencies/qt -j{{.NPROC}}
      - cmake --install {{.BUILD_DIR}}/dependencies/qt --prefix {{.HOLONIGHT_QT_PREFIX}}

  configure:
    desc: Configure a debug build
    deps: [build:qt-dependency]
    cmds:
      - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DENABLE_COVERAGE=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH={{.HOLONIGHT_QT_PREFIX}} -DHolonightQt_DIR={{.HOLONIGHT_QT_DIR}} -S .
      - ln -sf {{.BUILD_DIR}}/compile_commands.json .

  configure-tests:
    desc: Configure a debug build with tests
    deps: [build:qt-dependency]
    cmds:
      - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_COVERAGE=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH={{.HOLONIGHT_QT_PREFIX}} -DHolonightQt_DIR={{.HOLONIGHT_QT_DIR}} -S .
      - ln -sf {{.BUILD_DIR}}/compile_commands.json .

  configure-coverage:
    desc: Configure tests with coverage instrumentation
    deps: [build:qt-dependency]
    cmds:
      - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH={{.HOLONIGHT_QT_PREFIX}} -DHolonightQt_DIR={{.HOLONIGHT_QT_DIR}} -S .

  build:
    desc: Build the application
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j{{.NPROC}}

  run:
    desc: Build and run HoloNight Packages
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/holonight-packages

  test:
    desc: Build and run tests
    deps: [configure-tests]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j{{.NPROC}}
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure --no-tests=error

  coverage:
    desc: Generate an HTML coverage report
    deps: [configure-coverage]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target coverage
    generates: ["{{.BUILD_DIR}}/coverage/index.html"]

  format:
    desc: Format C++ sources
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target format

  format-check:
    desc: Check C++ formatting
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target format-check

  tidy:
    desc: Run clang-tidy
    deps: [configure-tests]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j{{.NPROC}}
      - cmake --build {{.BUILD_DIR}} --target tidy

  qml-lint:
    desc: Run qmllint
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target qml-lint

  clean:
    desc: Remove the build directory
    cmds:
      - rm -rf {{.BUILD_DIR}}
    prompt: Remove {{.BUILD_DIR}}/ entirely?
