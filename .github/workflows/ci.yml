name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-pkg-manager-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: pacman -S --noconfirm ripgrep python noto-fonts
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: fe69a59e6b73167fd5349223a4d265d75386c139
          path: holonight-config-dep
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 863af4183bdf09ce05199b37e8f5dfb46a311ba1
          path: holonight-qt-dep
      - name: Install HoloNight dependencies
        run: |
          cmake -S holonight-config-dep -B build/dependencies/config -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/dependencies/config --parallel
          cmake --install build/dependencies/config --prefix "$PWD/build/dependencies/prefix"
          cmake -S holonight-qt-dep -B build/dependencies/qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/dependencies/prefix" -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_WAYLAND=ON
          cmake --build build/dependencies/qt --parallel
          cmake --install build/dependencies/qt --prefix "$PWD/build/dependencies/prefix"
      - name: Configure
        run: cmake -B build -G Ninja -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$PWD/build/dependencies/prefix" -DTIDY_JOBS=2
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Existing QML tests under both styles
        run: |
          QT_QUICK_CONTROLS_STYLE=Holonight ctest --test-dir build -R InstalledPackagesViewTest --output-on-failure --no-tests=error
          QT_QUICK_CONTROLS_STYLE=Fusion ctest --test-dir build -R InstalledPackagesViewTest --output-on-failure --no-tests=error
      - name: Build and installed launch acceptance
        run: |
          python3 scripts/check-runtime-launches.py build/holonight-packages build/dependencies/prefix --logs build/uqc105/build-launch
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/build/uqc105/stage"
          cmake --build build --parallel
          cmake --install build/dependencies/config --prefix "$PWD/build/uqc105/stage"
          cmake --install build/dependencies/qt --prefix "$PWD/build/uqc105/stage"
          cmake --install build
          python3 scripts/check-runtime-launches.py build/uqc105/stage/bin/holonight-packages build/uqc105/stage --forbid-path "$PWD/build" --logs build/uqc105/install-launch
      - name: QML type metadata
        run: bash scripts/check-qmltypes.sh build
      - name: QML lint
        run: cmake --build build --target qml-lint

  static-checks:
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-pkg-manager-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: pacman -S --noconfirm ripgrep python noto-fonts
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: fe69a59e6b73167fd5349223a4d265d75386c139
          path: holonight-config-dep
      - uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 863af4183bdf09ce05199b37e8f5dfb46a311ba1
          path: holonight-qt-dep
      - name: Install HoloNight dependencies
        run: |
          cmake -S holonight-config-dep -B build/dependencies/config -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/dependencies/config --parallel
          cmake --install build/dependencies/config --prefix "$PWD/build/dependencies/prefix"
          cmake -S holonight-qt-dep -B build/dependencies/qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/dependencies/prefix" -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_WAYLAND=ON
          cmake --build build/dependencies/qt --parallel
          cmake --install build/dependencies/qt --prefix "$PWD/build/dependencies/prefix"
      - name: Configure
        run: cmake -B build -G Ninja -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$PWD/build/dependencies/prefix" -DTIDY_JOBS=2
      - name: Format check
        run: cmake --build build --target format-check
      - name: Generate artifacts for static analysis
        run: cmake --build build --parallel
      - name: Clang tidy
        run: cmake --build build --target tidy
